name: Pack

on:
  workflow_dispatch: 
  push:
    tags: 
    - '*'

jobs:
  build:

    runs-on: ubuntu-latest

    permissions: 
      id-token: write

    steps:
    - uses: actions/checkout@v2
    - name: Setup .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: 11.0.x
    - name: Restore dependencies
      run: dotnet restore Euonia.Build.slnx
    - name: Build
      run: dotnet build Euonia.Build.slnx --no-restore --configuration Release
    - name: Pack
      run: dotnet pack Euonia.Build.slnx -c Release -o artifacts/ 
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: zhaorong
    - name: Publish NuGet
      run: dotnet nuget push artifacts/*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate